<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-list-check logo-icon"></i>
                <h1>Task Dashboard</h1>
            </div>
            <p class="subtitle">Organize, track, and complete your weekly workload</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-value" id="totalCount">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="pendingCount">0</span>
                <span class="stat-label">Pending</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-card">
            <div class="input-wrapper">
                <i class="fa-regular fa-circle-plus input-icon"></i>
                <input type="text" id="taskInput" placeholder="Add a new high-priority task..." maxlength="80">
            </div>
            <button id="addButton">
                <i class="fa-solid fa-plus"></i> Add Task
            </button>
        </div>

        <!-- Task List Container -->
        <div class="list-card">
            <div class="list-header">
                <h2>Active Tasks</h2>
                <button id="clearAllBtn" class="clear-btn">Clear All</button>
            </div>
            <ul id="taskList">
                <!-- Tasks dynamically injected via JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
